name: Auto-update VPN Subscriptions V3 Pro

on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Add Repo Root to PYTHONPATH
        run: echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Xray Core
        uses: actions/cache@v4
        with:
          path: core/
          key: xray-core-linux-v1.8.24

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V3 Xray Pipeline
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          MY_WEBSITE: ${{ vars.MY_WEBSITE }}
        run: python main.py

      - name: Commit and Push Main Branch (README + stats + history)
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global rebase.autoStash true
          git add README.md configs/stats.json data/ assets/
          git commit -m "chore: update README, stats and history [$(date -u +'%Y-%m-%d %H:%M UTC')]" || echo "No changes to main"
          git pull --rebase origin main
          git push origin main

      - name: Push Configs to Output Branch
        run: |
          # Work in configs/ as an isolated git repo (output branch)
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          cd configs
          # Remove any leftover git state
          rm -rf .git
          git init
          git checkout -b output
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Add all generated subscription files
          git add -A
          git status
          git commit -m "feat: auto-update subscriptions [$(date -u +'%Y-%m-%d %H:%M UTC')]" || echo "No changes to configs"
          git push -f "$REPO_URL" output
