[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "free-vpn-aggregator"
version = "3.0.0"
description = "A scraper, validator, and aggregator for free VPN proxy configurations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Free_VPN_Aggregator"}
]
dependencies = [
    "telethon>=1.35.0",
    "aiohttp>=3.9.0",
    "python-socks>=2.4.0",
    "pyyaml>=6.0",
    "aiohttp-socks>=0.8.0",
    "pydantic<2.0.0",
    "rich>=13.0.0",
    "qrcode>=7.0",
    "pillow>=10.0.0",
    "maxminddb>=2.0.0",
    "pytest>=8.0.0"
]

[project.urls]
"Homepage" = "https://github.com/ewecrow78-gif/Free_VPN_Aggregator"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
